<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaspersky Engineering Mindset Game</title>
<style>
body{margin:0;background:#f6f6f3;color:#111;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}
.wrap{width:min(980px,100%)}
.kicker{font-size:13px;color:#888;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(38px,6vw,68px);line-height:1;margin:0 0 28px}
.progress{display:flex;gap:8px;margin-bottom:18px}.bar{height:6px;flex:1;background:#ddd;border-radius:99px}.bar.on{background:#111}.bar.done{background:#39ef91}
.card{background:#fff;border:1px solid #ddd;border-radius:28px;padding:48px;min-height:350px;display:flex;flex-direction:column;justify-content:space-between}
.step{color:#888;margin-bottom:18px}.q{font-size:clamp(28px,4vw,48px);font-weight:600;line-height:1.08;max-width:820px}
.rolebox{margin-top:28px;padding:22px 24px;border-radius:20px;background:#f2f2ef;max-width:860px}.rolebox .rolelabel{font-size:14px;color:#777;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}.rolebox .rolename{font-size:25px;font-weight:700;margin-bottom:12px}.rolebox .essence{font-size:18px;line-height:1.45;margin-bottom:14px}.rolebox .drive-title{font-size:15px;font-weight:700;margin-bottom:6px}.rolebox ul{margin:0 0 0 20px;padding:0;font-size:17px;line-height:1.4}.rolebox li{margin:4px 0}.actions{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap}
button{border:1px solid #111;border-radius:999px;padding:15px 30px;font-size:18px;cursor:pointer;background:#fff;color:#111;-webkit-text-fill-color:#111;opacity:1}.yes{background:#111;color:#fff;-webkit-text-fill-color:#fff}.no{background:#fff;color:#111;-webkit-text-fill-color:#111;border:1px solid #111}
.result{display:none}.pill{display:inline-block;background:#111;color:#fff;border-radius:999px;padding:16px 26px;font-size:24px;margin-bottom:24px}
.result h2{font-family:Georgia,serif;font-weight:400;font-size:clamp(36px,5vw,60px);line-height:1;margin:0 0 16px}
.result p{font-size:20px;line-height:1.4;max-width:760px;color:#333}.note{color:#888;font-size:14px;margin-top:16px}
@media(max-width:600px){.card{padding:28px}.actions button{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<div class="kicker">Kaspersky Engineering Mindset</div>
<h1>Какую роль играет бренд?</h1>
<div class="progress" id="progress"></div>
<div class="card">
  <div id="quiz">
    <div class="step" id="step"></div>
    <div class="q" id="q"></div>
    <div class="rolebox" id="rolebox">
      <div class="drive-title" id="qDriveTitle">Под этим имеем в виду:</div>
      <ul id="qDrives"></ul>
    </div>
    <div class="actions">
      <button class="yes" onclick="answer(true)">Да</button>
      <button class="no" onclick="answer(false)">Нет</button>
    </div>
  </div>
  <div class="result" id="result">
    <div class="pill" id="role"></div>
    <h2 id="title"></h2>
    <p id="text"></p>
    <button onclick="restart()">Пройти ещё раз</button>
  </div>
</div>
<div class="note">Отвечайте исходя из главной роли бренда, а не из всего, что он умеет делать.</div>
</div>
<script>
const qs=[
{
  q:"Это купленная сущность, которая не строится вокруг логики Kaspersky?",
  role:"",
  essence:"",
  drives:[],
  y:"IND", n:1
},
{
  q:"Главная задача бренда — доказать, что решение, экспертиза или технология Kaspersky реально работает?",
  role:"",
  essence:"",
  drives:[
    "доказанную эффективность",
    "доверие",
    "прозрачность",
    "уверенность в результате",
    "способность подтверждать обещания фактами",
    "измеримый эффект от решений"
  ],
  y:"PROVE", n:2
},
{
  q:"Главная задача бренда — превращать экспертизу Kaspersky в работающий продукт, технологию или систему?",
  role:"",
  essence:"",
  drives:[
    "инженерную глубину",
    "технологическую состоятельность",
    "реализацию сложных идей на практике",
    "надёжность и стабильность",
    "масштабируемость",
    "интеграцию технологий в работающие системы"
  ],
  y:"ENGINEER", n:3
},
{
  q:"Главная задача бренда — создавать новые подходы, идеи или способы решения задач?",
  role:"",
  essence:"",
  drives:[
    "оригинальное мышление",
    "поиск новых подходов и гипотез",
    "R&D и эксперименты",
    "создание новых технологий и методологий",
    "способность ставить под вопрос привычные решения",
    "видение того, как категория может развиваться дальше"
  ],
  y:"INVENT", n:4
},
{
  q:"Главная задача бренда — помогать глубже понимать угрозы, технологии, пользователей или бизнес?",
  role:"",
  essence:"",
  drives:[
    "глубокое понимание проблемы и её причин",
    "понимание реальных потребностей пользователя и бизнеса",
    "способность видеть связи и контекст",
    "экспертность, основанную на знаниях и исследованиях",
    "релевантность решения реальной задаче"
  ],
  y:"UNDERSTAND", n:"NONE"
}
];
const rs={
IND:["НЕЗАВИСИМЫЙ БРЕНД","Вне Engineering Mindset",`<div class="desc">
<strong>Суть роли</strong>
Бренд живёт по собственной логике и не обязан транслировать позиционирование Kaspersky.
<strong>Что драйвит</strong>
<ul>
<li>собственное позиционирование и бренд-платформу,</li>
<li>свои смыслы, ценности и характер,</li>
<li>собственную визуальную систему и коммуникацию.</li>
</ul>
</div>`],

UNDERSTAND:["UNDERSTAND","See the whole problem",`<div class="desc">
<strong>Суть роли</strong>
Бренд помогает Kaspersky глубже понимать проблему целиком: угрозы, технологии, пользователей, бизнес и контекст.
<strong>Что драйвит</strong>
<ul>
<li>глубокое понимание проблемы и её причин,</li>
<li>понимание реальных потребностей пользователя и бизнеса,</li>
<li>экспертность, аналитику и исследовательский подход,</li>
<li>релевантность решения реальной задаче.</li>
</ul>
</div>`],

INVENT:["INVENT","Find a better answer",`<div class="desc">
<strong>Суть роли</strong>
Бренд показывает, что Kaspersky не принимает существующий подход как единственно возможный и ищет лучший способ решить задачу.
<strong>Что драйвит</strong>
<ul>
<li>оригинальное мышление и новые идеи,</li>
<li>поиск новых подходов и гипотез,</li>
<li>R&D, эксперименты и собственные разработки,</li>
<li>видение того, как категория может развиваться дальше.</li>
</ul>
</div>`],

ENGINEER:["ENGINEER","Make it work",`<div class="desc">
<strong>Суть роли</strong>
Бренд превращает идеи и экспертизу Kaspersky в реально работающие продукты, технологии и системы.
<strong>Что драйвит</strong>
<ul>
<li>инженерную глубину и технологическую состоятельность,</li>
<li>реализацию сложных идей на практике,</li>
<li>надёжность, стабильность и масштабируемость,</li>
<li>интеграцию технологий в работающие системы.</li>
</ul>
</div>`],

PROVE:["PROVE","Prove it works",`<div class="desc">
<strong>Суть роли</strong>
Бренд доказывает, что решения и экспертиза Kaspersky реально работают и подтверждаются результатами.
<strong>Что драйвит</strong>
<ul>
<li>доказанную эффективность,</li>
<li>доверие и уверенность в результате,</li>
<li>прозрачность и проверяемость обещаний,</li>
<li>измеримый эффект через тесты, кейсы и реальные результаты.</li>
</ul>
</div>`],

NONE:["РОЛЬ НЕ ОПРЕДЕЛЕНА","Нужно уточнить главную функцию бренда",`<div class="desc">
<strong>Суть</strong>
Ни одна из четырёх ролей не стала доминирующей.
<strong>Что делать</strong>
<ul>
<li>точнее сформулировать, зачем сущность существует,</li>
<li>понять её главную задачу для портфеля,</li>
<li>выбрать одну ведущую роль, а не всё сразу.</li>
</ul>
</div>`]
};
let i=0;
function draw(){
  document.getElementById("quiz").style.display="block";
  document.getElementById("result").style.display="none";
  step.textContent=`Вопрос ${i+1} из ${qs.length}`;
  q.textContent=qs[i].q;
  const roleBox = document.getElementById("rolebox");
  if (i === 0) {
    roleBox.style.display = "none";
  } else {
    roleBox.style.display = "block";
    qDrives.innerHTML=qs[i].drives.map(item=>`<li>${item}</li>`).join("");
  }
  progress.innerHTML=qs.map((_,k)=>`<div class="bar ${k<i?"done":k===i?"on":""}"></div>`).join("");
}
function answer(v){
  const next=v?qs[i].y:qs[i].n;
  if(typeof next==="string") return show(next);
  i=next; draw();
}
function show(k){
  quiz.style.display="none"; result.style.display="block";
  role.textContent=rs[k][0]; title.textContent=rs[k][1]; text.innerHTML=rs[k][2];
  progress.innerHTML=qs.map((_,k2)=>`<div class="bar ${k2<=i?"done":""}"></div>`).join("");
}
function restart(){i=0;draw()}
draw();
</script>
</body>
</html>
